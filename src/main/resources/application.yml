# ========================================
# SERVER CONFIGURATION
# ========================================
server:
  port: ${SERVER_PORT:8080}
  # Confia nos cabeçalhos X-Forwarded-* do proxy (Railway): o ForwardedHeaderFilter do Spring ajusta
  # remoteAddr/scheme/host a partir do XFF do proxy. Necessário para o rate-limit do waitlist contar o
  # IP real do cliente (não o do proxy) e impedir spoofing do X-Forwarded-For. Sem proxy/sem XFF é no-op.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

# ========================================
# SPRING CORE CONFIGURATION
# ========================================
spring:
  application:
    name: menthoros-app

  mvc:
    problemdetails:
      enabled: true

  # ---------------------------------------
  # Security
  # ---------------------------------------

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9999/realms/menthoros}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:9999/realms/menthoros/protocol/openid-connect/certs}
  # ========================================
  # TASK SCHEDULING CONFIGURATION
  # ========================================

  task:
    scheduling:
      pool:
        size: 5  # Number of scheduler threads
      thread-name-prefix: "menthoros-scheduler-"
      shutdown:
        await-termination: true
        await-termination-period: 60s

  # ----------------------------------------
  # MULTIPART UPLOAD (import de .fit)
  # ----------------------------------------
  # Limite explícito de tamanho — um .fit real raramente passa de poucos MB; sem isto, o
  # endpoint dependeria dos defaults implícitos do Spring Boot (1MB/10MB) sem que ninguém
  # precisasse decidir isso conscientemente para um upload binário não confiável.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ----------------------------------------
  # DATABASE CONFIGURATION
  # ----------------------------------------
  datasource:
    url: jdbc:postgresql://${POSTGRES_DB:localhost}:${DB_PORT:5432}/${DB_NAME:menthoros-db}
    username: ${POSTGRES_USER:menthoros}
    password: ${POSTGRES_PASSWORD:menthoros123}
    driver-class-name: org.postgresql.Driver

  # ----------------------------------------
  # JPA/HIBERNATE CONFIGURATION
  # ----------------------------------------
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  jpa:
    properties:
      hibernate:
        format_sql: true    # formata SQL no console
    show-sql: false
    open-in-view: false    # evita manutenção de sessão aberta
    hibernate:
      ddl-auto: validate

  # ----------------------------------------
  # FLYWAY CONFIGURATION
  # ----------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
    clean-disabled: false


  # ----------------------------------------
  # AI/OPENAI + ANTHROPIC CONFIGURATION
  # ----------------------------------------
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
          temperature: 0.2
          max-tokens: 12000
          top-p: 0.9
          frequency-penalty: 0.1
          presence-penalty: 0.0
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536

management:
  endpoints:
    web:
      exposure:
        # prometheus: métricas llm_* do CostTrackingAdvisor (fix-llm-routing-finops);
        # endpoint autenticado — só /actuator/health é público (SecurityConfig).
        include: health,prometheus
  endpoint:
    health:
      # when-authorized: anônimos (probes do Railway) recebem só {"status":"UP"};
      # detalhes de componentes (db, pool) só para requisições autenticadas.
      show-details: when-authorized
# ========================================
# API DOCUMENTATION CONFIGURATION
# ========================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# ========================================
# APPLICATION SPECIFIC CONFIGURATION
# ========================================
app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5174}


  # ----------------------------------------
  # CONVITE DE ATLETA (por token do backend)
  # ----------------------------------------
  athlete-invite:
    # Validade do link. Reenvio gera token novo e invalida o anterior.
    validity-days: ${ATHLETE_INVITE_VALIDITY_DAYS:7}
    rate-limit:
      # GET publico de consulta do convite, por IP, no PublicEndpointRateLimitFilter.
      per-minute: ${FOUNDING_INVITE_LOOKUP_RATE_PER_MINUTE:10}

  # ----------------------------------------
  # E-MAIL TRANSACIONAL DO BACKEND
  # ----------------------------------------
  # Remetente e outbox. Credenciais SMTP ficam em spring.mail.* (perfis cloud/dev), lidas de
  # SMTP_* — os mesmos valores das KC_SMTP_* do Keycloak. Em local/test/integration o carteiro
  # grava .eml no outbox-dir e nao existe SMTP; na nuvem, sem SMTP_HOST o startup falha.
  email:
    from: ${SMTP_FROM:nao-responda@menthoros.com}
    from-name: ${SMTP_FROM_NAME:Menthoros}
    outbox-dir: ${EMAIL_OUTBOX_DIR:target/outbox}

  # ----------------------------------------
  # CONVITE DAS ASSESSORIAS FUNDADORAS
  # ----------------------------------------
  founding-invite:
    # Validade do link. Reenvio gera token novo e invalida o anterior.
    validity-days: ${FOUNDING_INVITE_VALIDITY_DAYS:7}
    rate-limit:
      # GET publico de consulta do convite, por IP, no PublicEndpointRateLimitFilter.
      per-minute: ${FOUNDING_INVITE_LOOKUP_RATE_PER_MINUTE:10}

  # ----------------------------------------
  # AUTO-CADASTRO PÚBLICO DE ASSESSORIA
  # ----------------------------------------
  # Três dimensões contra abuso. Os valores começam BAIXOS de propósito: com volume real
  # perto de zero, um teto alto nunca alarma — e o recurso escasso não é linha de banco,
  # é a cota diária de e-mail. Esgotá-la faz a verificação dos cadastros LEGÍTIMOS parar
  # de sair, sem erro visível para ninguém.
  coach-signup:
    # Default DESLIGADO: o deploy nunca liga sozinho um endpoint anonimo que provisiona no
    # Keycloak e cria tenant. Ligar e decisao operacional; e tambem o kill switch, que precisa
    # ser variavel de ambiente para valer em minutos, sem reverter codigo.
    enabled: ${COACH_SIGNUP_ENABLED:false}
    # Teto de corpo. A validacao do DTO so roda depois da desserializacao — sem teto, o parsing
    # de um POST grande acontece antes de haver chance de recusar.
    max-request-bytes: ${COACH_SIGNUP_MAX_BODY_BYTES:8192}
    rate-limit:
      # Por IP, no filtro (PublicEndpointRateLimitFilter). Janela de hora: cadastro é ação
      # rara e cara; quem faz três num minuto não é humano.
      per-hour: ${COACH_SIGNUP_RATE_PER_HOUR:3}
      # Por e-mail e teto global, no serviço — um filtro não enxerga o e-mail sem consumir
      # o corpo da requisição, e o teto global precisa de contagem persistida (memória de
      # processo zeraria a cada deploy e se multiplicaria por instância).
      per-email-per-day: ${COACH_SIGNUP_RATE_PER_EMAIL_DAY:3}
      daily-cap: ${COACH_SIGNUP_DAILY_CAP:20}

  # ----------------------------------------
  # LGPD / CONSENTIMENTO DO COACH
  # ----------------------------------------
  lgpd:
    # off | report-only | on — `report-only` desde 2026-08-03: não bloqueia ninguém, só registra
    # quem seria bloqueado. É o insumo para decidir quando `on` é seguro.
    # NÃO virar para `on` enquanto os gates do bloco 5 de `add-coach-lgpd-consent` estiverem abertos
    # (validação jurídica do texto e comunicação prévia aos coaches).
    consent-enforcement: ${LGPD_CONSENT_ENFORCEMENT:report-only}
    # Datas de vigência dos documentos publicados. Precisam bater com o que a página exibe:
    # divergência = registro apontando para um texto que o coach não viu.
    # Sincronizadas com POLITICA_VERSAO/TERMOS_VERSAO do frontend — mudar aqui exige mudar lá.
    policy-version: ${LGPD_POLICY_VERSION:2026-08-03}
    terms-version: ${LGPD_TERMS_VERSION:2026-08-03}

  # ----------------------------------------
  # OPENAPI DOCUMENTATION CONFIGURATION
  # ----------------------------------------
  openapi:
    title: Menthoros API
    description: API para gerenciar atletas, treinos e planejamento
    contact-name: Menthoros Team
    contact-email: contact@menthoros.com
    environment: ${SPRING_PROFILES_ACTIVE:dev}
  # ----------------------------------------
  # CACHE CONFIGURATION
  # ----------------------------------------
  cache:
    default-ttl: PT30M  # 30 minutes
    maximum-size: 1000

  # ----------------------------------------
  # CORS CONFIGURATION
  # ----------------------------------------
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

  # ----------------------------------------
  # LLM CONFIGURATION
  # ----------------------------------------
  llm:
    max-tokens: 4000
    temperature: 0.2
    timeout: 30000  # 30 seconds
    thread-pool:
      core-size: 2
      max-size: 5
      queue-capacity: 100
    # Roteamento multi-modelo (MultiModelConfig) — RISK-01/ADR-FIN-02:
    # model IDs e parâmetros externalizados; preços em llm-pricing.yml.
    # timeout: teto da chamada HTTP ao modelo, por rota (ADR-0008). É por rota e não
    # por provider porque simple e plano são o mesmo provider com latências muito
    # diferentes. Valores derivados de max-tokens — só o plano tem número observado
    # (~80s); recalibrar com o Timer por rota do CostTrackingAdvisor.
    routing:
      simple:            # tradução, extração, classificação simples
        model: gpt-4o-mini
        temperature: 0.3
        max-tokens: 1000
        timeout: 20s
      standard:          # análises rápidas, chatbot, sumarização
        model: claude-haiku-4-5-20251001
        temperature: 0.5
        max-tokens: 2000
        timeout: 30s
      complex:           # análise pós-treino com skill, prescrição
        model: claude-sonnet-4-6
        temperature: 0.7
        max-tokens: 4000
        timeout: 45s
      expert:            # deep-reasoning: lesões, casos clínicos
        model: gpt-4o
        # 0.2 (era 0.8): raciocínio especialista/clínico pede determinismo;
        # 0.8 era semântica de geração criativa, invertida para esta rota.
        temperature: 0.2
        max-tokens: 8000
        timeout: 90s
      plano:             # geração de plano semanal — fluxo mais caro e crítico
        model: gpt-4o
        temperature: 0.2
        max-tokens: 12000
        timeout: 120s

  # ----------------------------------------
  # IA SERVICE CONFIGURATION
  # ----------------------------------------
  ia:
    service:
      strategy: original  # enhanced | fixed | original

  # ----------------------------------------
  # BATCH PLAN GENERATION CONFIGURATION
  # ----------------------------------------
  batch-plan:
    # Máximo de chamadas ao LLM em voo simultaneamente no lote (Semaphore), global por JVM
    # e independente do nº de virtual threads. Controla custo e risco de 429 do provedor —
    # e SÓ isso: desde refactor-llm-call-outside-transaction a chamada ao LLM roda fora de
    # transação, então subir este valor não fixa conexões do pool do Hikari (antes era 1:1 e,
    # com pool 5 em cloud, 4 em voo deixavam 1 conexão para o app inteiro). Com a chave no
    # tier 3 da OpenAI, 8-10 é folga suficiente para 100 planos caberem em ~15 min.
    llm-concorrencia: ${BATCH_PLAN_LLM_CONCORRENCIA:4}
    # Máximo de gerações em voo POR ASSESSORIA dentro do lote (fair-llm-concurrency-per-tenant):
    # com vários lotes na mesma janela, nenhuma assessoria monopoliza a fila — todas progridem a
    # até este valor por vez. Não altera a vazão total (o global continua o teto).
    # Neutralizar sem deploy: valor >= llm-concorrencia.
    llm-concorrencia-por-tenant: ${BATCH_PLAN_LLM_CONCORRENCIA_POR_TENANT:2}
    # Permits do global que o LOTE não pode ocupar, reservados para o "gerar" individual do
    # treinador — quem clica durante um lote não espera a fila drenar. O interativo pode usar a
    # capacidade ociosa do lote; o contrário, nunca. Neutralizar sem deploy: 0.
    llm-reserva-interativa: ${BATCH_PLAN_LLM_RESERVA_INTERATIVA:1}
    # Idade mínima (min) para um job em andamento ser considerado órfão no recovery
    # de startup — nenhum lote real dura tanto.
    recovery-limite-min: ${BATCH_PLAN_RECOVERY_LIMITE_MIN:30}

  # ----------------------------------------
  # SECURITY CONFIGURATION
  # ----------------------------------------
  security:
    user-sync:
      # Janela mínima entre registros de "último acesso". O sync roda a cada requisição; sem
      # throttle, cada uma é um UPDATE em tb_usuario (amplificador do incidente de pool de
      # 2026-09-04). Diff de dados do JWT (email, role, owner...) escreve SEMPRE, independente
      # da janela. PT0S desliga o throttle (rollback sem deploy de código).
      access-throttle: ${USER_SYNC_ACCESS_THROTTLE:PT5M}
    public-paths:
      - "/api/public/**"
      - "/swagger-ui.html"
      - "/swagger-ui/**"
      - "/api-docs"
      - "/api-docs/**"
      - "/v3/api-docs"
      - "/v3/api-docs/**"
      - "/actuator/health"
      - "/api/v1/status"
      - "/api/v1/waitlist"
    strava-paths:
      - "/api/v1/strava/webhook"
      - "/api/v1/strava/callback"
    asaas-paths:
      - "/api/v1/asaas/webhook"

  # ----------------------------------------
  # STRAVA INTEGRATION CONFIGURATION
  # ----------------------------------------
  strava:
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    redirect-uri: ${STRAVA_REDIRECT_URI:http://localhost:8099/api/v1/strava/callback}
    authorization-uri: https://www.strava.com/oauth/authorize
    token-uri: https://www.strava.com/oauth/token
    api-base-url: https://www.strava.com/api/v3
    webhook-verify-token: ${STRAVA_WEBHOOK_TOKEN:}
    sync-days-back: ${STRAVA_SYNC_DAYS_BACK:90}

  # ----------------------------------------
  # INTERVALS.ICU INTEGRATION CONFIGURATION
  # ----------------------------------------
  # OAuth2 (app 663). O default vazio de client-id/client-secret NAO significa "opcional":
  # os campos sao @NotBlank e o boot falha com mensagem nomeando a propriedade. O default
  # existe so para que a falha seja a da validacao, e nao um "Could not resolve placeholder".
  # O client-secret e a chave do HMAC que assina o state do callback publico -- com valor
  # vazio o state vira forjavel e o fluxo funciona mesmo assim, sem sintoma nenhum.
  # Ver IntervalsIcuProperties e D11 da change.
  intervals-icu:
    base-url: ${INTERVALS_ICU_BASE_URL:https://intervals.icu}
    client-id: ${INTERVALS_ICU_CLIENT_ID:}
    client-secret: ${INTERVALS_ICU_CLIENT_SECRET:}
    redirect-uri: ${INTERVALS_ICU_REDIRECT_URI:http://localhost:8099/api/v1/integracoes/intervals-icu/callback}
    authorization-uri: https://intervals.icu/oauth/authorize
    token-uri: https://intervals.icu/api/oauth/token
    scope: ACTIVITY:READ,CALENDAR:WRITE
    # Scheduler de sync automatico (intervals-icu-activity-sync-scheduler). Ver IntervalsIcuProperties.
    sync-days-back: ${INTERVALS_ICU_SYNC_DAYS_BACK:90}
    sync-overlap-days: ${INTERVALS_ICU_SYNC_OVERLAP_DAYS:7}
    sync-max-activities-per-cycle: ${INTERVALS_ICU_SYNC_MAX_ACTIVITIES_PER_CYCLE:6}

# ----------------------------------------
# DETERMINISTIC PLANNER ENGINE (shadow mode — deterministic-planner-engine)
#
# Motor deterministico roda em paralelo ao pipeline legado, apenas para auditoria
# e metricas de calibracao. planner_enabled persistido e sempre false nesta change;
# nao existem flags enabled/fail-open aqui — nascem em planner-engine-enforcement.
# ----------------------------------------
planner-engine:
  shadow: ${PLANNER_ENGINE_SHADOW:false}
  # Enforcement (planner-engine-enforcement): skeleton vinculante no prompt + compliance no retry.
  # `enabled=false` por padrão (rollout gated — ver tasks 8.4); `fail-open=true` inicial: violacao
  # SOFT do estagio 2 persiste FAILED + revisao, mas invariante OBRIGATORIA (hard) sempre falha
  # fechado (422), acima do fail-open (design Decisao 3).
  enabled: ${PLANNER_ENGINE_ENABLED:false}
  fail-open: ${PLANNER_ENGINE_FAIL_OPEN:true}
  injury:
    recent-window-days: ${PLANNER_ENGINE_INJURY_RECENT_WINDOW_DAYS:30}

# ----------------------------------------
# ATHLETE ONBOARDING BASELINE (athlete-onboarding-baseline)
#
# Kill-switch do auto-approve do Cenario A (CA5, design.md Decisao 7) — quando
# desabilitado, todo plano volta a nascer AGUARDANDO_REVISAO independente do score.
#
# migrate-existing: kill-switch da migracao automatica de atletas legados (design.md
# Decisao 6, tasks.md 5.7) — quando desabilitado, atletas SEM AthleteBaselineSnapshot
# ainda continuam sem OnboardingContext (comportamento anterior a esta change); atletas
# ja migrados/onboarded continuam recalculando normalmente (necessario para CA3).
# ----------------------------------------
onboarding:
  auto-approve:
    enabled: ${ONBOARDING_AUTO_APPROVE_ENABLED:true}
  migrate-existing:
    enabled: ${ONBOARDING_MIGRATE_EXISTING_ENABLED:true}

# ----------------------------------------
# ASAAS BILLING INTEGRATION (assessoria-billing-asaas)
#
# Cobranca B2B das assessorias. base-url por profile (sandbox: api-sandbox,
# producao: api.asaas.com). api-key e webhook.access-token sao segredos —
# sempre via variavel de ambiente, nunca hardcoded.
# ----------------------------------------
asaas:
  # mock=true (default) usa AsaasGatewayMock — ainda sem ligação real com o provider.
  # Virar para false (ASAAS_MOCK=false) quando o Asaas estiver conectado.
  mock: ${ASAAS_MOCK:true}
  base-url: ${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
  api-key: ${ASAAS_API_KEY:}
  user-agent: ${ASAAS_USER_AGENT:menthoros-backend}
  webhook:
    access-token: ${ASAAS_WEBHOOK_ACCESS_TOKEN:}

# ----------------------------------------
# KEYCLOAK ADMIN REST API
# ----------------------------------------
keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
    realm: ${KEYCLOAK_ADMIN_REALM:menthoros}
    token-realm: ${KEYCLOAK_ADMIN_TOKEN_REALM:master}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KC_ADMIN_USER:admin}
    password: ${KC_ADMIN_PASSWORD:}


# ========================================
# LOGGING CONFIGURATION
# ========================================
logging:
  level:
    root: info
