# ========================================
# PERFIL: dev  (Railway cloud / local docker)
# ========================================
spring:
  config:
    activate:
      on-profile: dev

  # ----------------------------------------
  # DATABASE — Railway ou local
  #
  # Ordem de resolução:
  #   1. PGHOST / PGPORT / PGDATABASE / POSTGRES_USER / POSTGRES_PASSWORD
  #      → injetados pelo serviço Postgres do Railway
  #   2. DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD
  #      → definidos no docker-compose local
  #   3. Defaults hardcoded (localhost, menthoros-db, etc.)
  # ----------------------------------------
  datasource:
    url: jdbc:postgresql://${POSTGRES_DB:localhost}:${DB_PORT:5432}/${DB_NAME:menthoros-db}
    username: ${POSTGRES_USER:menthoros}
    password: ${POSTGRES_PASSWORD:menthoros123}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Paridade com o cloud (ver application-cloud.yml, dimensionado no incidente de
      # 2026-09-04). Aqui o Postgres e o do docker-compose local, sem o limite do Railway;
      # a env var permite divergir por ambiente sem tocar codigo.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ----------------------------------------
  # JPA / HIBERNATE
  # ----------------------------------------
  jpa:
    properties:
      hibernate:
        "[format_sql]": false.env
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none              # Flyway gerencia o schema

  # ----------------------------------------
  # FLYWAY
  # ----------------------------------------
  flyway:
    enabled: true

  # ----------------------------------------
  # CACHE — Caffeine (sem Redis no Railway por padrão)
  # ----------------------------------------
  cache:
    type: caffeine

  # ----------------------------------------
  # OAUTH2 / SECURITY — Keycloak Railway
  # ----------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.menthoros.com/realms/menthoros}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://auth.menthoros.com/realms/menthoros/protocol/openid-connect/certs}
  # ----------------------------------------
  # SMTP — e-mail transacional do backend
  #
  # Com defaults, ao contrario do cloud: no docker local nao ha SMTP e o
  # backend precisa subir; o envio falha em runtime (502), nao no startup.
  # ----------------------------------------
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:2587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

# ========================================
# LOGGING
# ========================================
logging:
  level:
    root: debug
    "[org.hibernate.SQL]": off
    "[org.hibernate.type.descriptor.sql.BasicBinder]": off
    "[org.hibernate.orm.jdbc.bind]": off
    "[org.springframework.orm.jpa]": warn
    "[org.springframework.transaction]": warn
    "[com.zaxxer.hikari]": warn
